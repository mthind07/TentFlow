#Production is selected by SPRING_PROFILES_ACTIVE=production.
spring.thymeleaf.cache=true

#Fail closed for browser cookies behind an HTTPS reverse proxy. The local
#Compose profile overrides this to false because it serves plain HTTP.
server.servlet.session.cookie.secure=${TENTFLOW_COOKIE_SECURE:true}

#Keep the database pool bounded for a small single-instance deployment.
spring.datasource.hikari.maximum-pool-size=${TENTFLOW_DATABASE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${TENTFLOW_DATABASE_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

#Avoid leaking implementation details in default error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never