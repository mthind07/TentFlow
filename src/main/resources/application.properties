spring.application.name=tentflow
server.port=${PORT:8080}

#TentFlow stores calendar business windows as Toronto local time
spring.jackson.time-zone=America/Toronto

#local defaults match compose.yaml, production-like values can override these with environment variables
#individual host values support managed databases such as Render without passing a non-JDBC postgresql:// URL to the driver
spring.datasource.url=${TENTFLOW_DATABASE_URL:jdbc:postgresql://${TENTFLOW_DATABASE_HOST:localhost}:${TENTFLOW_DATABASE_PORT:5432}/${TENTFLOW_DATABASE_NAME:tentflow}}
spring.datasource.username=${TENTFLOW_DATABASE_USERNAME:tentflow}
spring.datasource.password=${TENTFLOW_DATABASE_PASSWORD:tentflow}

#flyway owns the schema hibernate only checks that Java mappings agree with the migrations
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#finish in-flight work cleanly during a container restart or rolling deploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

#local HTTP keeps secure=false, the production profile changes the default to true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${TENTFLOW_COOKIE_SECURE:false}

#OpenAPI documentation endpoints
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#REST clients receive short-lived HMAC-SHA256 JWT access tokens
#the secret must be Base64 that decodes to at least 32 random bytes and there is intentionally no checked-in default secret
tentflow.security.jwt-secret=${TENTFLOW_JWT_SECRET}
tentflow.security.issuer=tentflow
tentflow.security.audience=tentflow-api
tentflow.security.access-token-ttl=PT15M
tentflow.security.bcrypt-strength=${TENTFLOW_BCRYPT_STRENGTH:12}

#first administrator is created only when both values are supplied the application never creates a known default administrator password
tentflow.security.bootstrap-admin-email=${TENTFLOW_BOOTSTRAP_ADMIN_EMAIL:}
tentflow.security.bootstrap-admin-password=${TENTFLOW_BOOTSTRAP_ADMIN_PASSWORD:}

#every minute automation looks for due CONFIRMED reservations, it reuses the existing completion and waitlist-recheck workflow
tentflow.automation.enabled=${TENTFLOW_AUTOMATION_ENABLED:true}
tentflow.automation.fixed-delay=${TENTFLOW_AUTOMATION_FIXED_DELAY:PT1M}

#management traffic stays on a separate internal port, while /livez and /readyz
#are mirrored onto the public application port for platform health checks
management.server.port=${TENTFLOW_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true