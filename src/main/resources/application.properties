spring.application.name=tentflow

#business date-times mean wall time in Toronto
spring.jackson.time-zone=America/Toronto

#local defaults match compose.yaml
spring.datasource.url=${TENTFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/tentflow}
spring.datasource.username=${TENTFLOW_DATABASE_USERNAME:tentflow}
spring.datasource.password=${TENTFLOW_DATABASE_PASSWORD:tentflow}

#flyway creates the schema. Hibernate only checks it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html