services:
  database:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: tentflow
      POSTGRES_USER: tentflow
      POSTGRES_PASSWORD: tentflow
    ports:
      - "5432:5432"
    volumes:
      - tentflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tentflow -d tentflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tentflow-postgres: